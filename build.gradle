plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.+'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'AzureDoom Mods'
        url = 'https://maven.azuredoom.com/mods'
    }
    maven {
        name = 'Create' // Create, Ponder, Flywheel
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Registrate'
        url = 'https://mvn.devos.one/snapshots'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Nullscape 1.2.14 (mod build, NeoForge 1.21.1), loaded in dev runs. Modrinth version id 3fv8O3xX.
    runtimeOnly "maven.modrinth:nullscape:3fv8O3xX"

    // Create is an optional dependency (see net.endlessvoid.compat.create): compiled against, never bundled or
    // required. Dev runs load it only with -Pcreate_in_dev=true (or create_in_dev=true in gradle.properties).
    def create = "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    def ponder = "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    def registrate = "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly(create) { transitive = false }
    compileOnly ponder
    compileOnly registrate
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    if (providers.gradleProperty('create_in_dev').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly(create) { transitive = false }
        runtimeOnly ponder
        runtimeOnly registrate
        runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    }

    // Custom Portal API Reforged: not used by the Void portal. Uncomment (and set cpapi_version) if it's
    // adopted for data-driven Nether portals.
    // implementation "net.kyrptonaught.customportalapi:cpapireforged-neo-${minecraft_version}:${cpapi_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
